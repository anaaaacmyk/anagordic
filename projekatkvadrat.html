  <div class="text-overlay">

          <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />

  <div class="hand-drawn-star pulsing">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <g filter="url(#smooth-ink-wobble)">
        <path d="M 52,15 L 63,38 L 88,35 L 72,56 L 82,82 L 48,70 L 17,85 L 28,57 L 8,42 L 36,37 Z" 
              stroke="rgb(255, 238, 140)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <path d="M 50,17 L 64,36 L 86,36 L 74,54 L 80,83 L 49,68 L 19,83 L 27,58 L 10,40 L 37,38 Z" 
              stroke="rgb(255, 238, 140)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6" />
      </g>
    </svg>
  </div>

  <div class="face">>:(</div>

  <script>
    const star = document.querySelector('.hand-drawn-star');
    const face = document.querySelector('.face');
    const textOverlay = document.querySelector('.text-overlay');
    let isResetting = false;
    let escapeTimeout = null;

    function teleportStar() {
      if (isResetting) return;

      if (star.classList.contains('pulsing')) {
        star.classList.remove('pulsing');
      }

      const vmin = Math.min(window.innerWidth, window.innerHeight) / 100;
      const randomSizeVmin = Math.floor(Math.random() * (50 - 20 + 1)) + 20;
      const starSizePx = randomSizeVmin * vmin;

      star.style.width = `${randomSizeVmin}vmin`;
      star.style.height = `${randomSizeVmin}vmin`;

      const randomX = Math.floor(Math.random() * (window.innerWidth - starSizePx));
      const randomY = Math.floor(Math.random() * (window.innerHeight - starSizePx));

      star.style.position = 'absolute';
      star.style.left = `${randomX}px`;
      star.style.top = `${randomY}px`;
      star.style.transform = `rotate(${Math.random() * 360}deg)`;
    }

    // 1. RUN AWAY ENGINE (Reaction window near-instantaneous at 15ms)
    star.addEventListener('mouseover', () => {
      if (isResetting) return;
      
      clearTimeout(escapeTimeout);
      escapeTimeout = setTimeout(teleportStar, 15); 
    });

    // 2. THE CATCH ENGINE 
    star.addEventListener('pointerdown', (e) => {
      if (isResetting) return;
      isResetting = true;

      clearTimeout(escapeTimeout);

      star.style.display = 'none';
      textOverlay.style.display = 'none';

      const faceX = Math.floor(Math.random() * (window.innerWidth - 50));
      const faceY = Math.floor(Math.random() * (window.innerHeight - 50));
      
      face.style.left = `${faceX}px`;
      face.style.top = `${faceY}px`;
      face.style.display = 'flex';

      // 3. THE 2-SECOND RESET
      setTimeout(() => {
        face.style.display = 'none';

        star.style.transition = 'none';
        star.style.width = '50vmin';
        star.style.height = '50vmin';
        star.style.left = 'calc(50vw - 25vmin)';
        star.style.top = 'calc(50vh - 25vmin)';
        star.style.transform = 'rotate(0deg)';
        
        star.style.display = 'block';
        textOverlay.style.display = 'block';

        setTimeout(() => {
          star.classList.add('pulsing');
          
          // Flight tracking hyper-accelerated to 0.12s
          star.style.transition = 'left 0.12s cubic-bezier(0.25, 1, 0.5, 1), top 0.12s cubic-bezier(0.25, 1, 0.5, 1), transform 0.1s ease';
          
          isResetting = false;
        }, 50);

      }, 2000);
    });
  </script>
